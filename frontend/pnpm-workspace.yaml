packages:
  - "."

# drizzle-kit 0.31.10 still depends on these deprecated packages upstream.
allowedDeprecatedVersions:
  "@esbuild-kit/core-utils": "3.3.2"
  "@esbuild-kit/esm-loader": "2.6.5"

# @napi-rs/wasm-runtime 1.2.0 requests emnapi v2, while the optional
# unrs WASM binding that installs it pins emnapi v1.10.0.
peerDependencyRules:
  allowedVersions:
    "@napi-rs/wasm-runtime>@emnapi/core": "1.10.0"
    "@napi-rs/wasm-runtime>@emnapi/runtime": "1.10.0"

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
